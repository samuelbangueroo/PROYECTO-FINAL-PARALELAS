name: Construir y publicar API

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagen:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/samuelbangueroo/proyecto-final-paralelas:${{ github.sha }}

  desplegar:
    needs: imagen
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: ec2-production
      cancel-in-progress: false

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Obtener credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Preparar comandos de despliegue
        env:
          API_IMAGE: ghcr.io/samuelbangueroo/proyecto-final-paralelas:${{ github.sha }}
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          commands = [
              "set -eu",
              "install -d -m 700 /opt/voltrix/scripts",
              "if [ ! -f /opt/voltrix/.env ]; then install -m 600 /home/ubuntu/PROYECTO-FINAL-PARALELAS/.env /opt/voltrix/.env; fi",
          ]
          for source, target in [
              ("compose.ec2.yml", "/opt/voltrix/compose.ec2.yml"),
              ("scripts/deploy.sh", "/opt/voltrix/scripts/deploy.sh"),
          ]:
              encoded = base64.b64encode(Path(source).read_bytes()).decode()
              commands.append(
                  f"printf '%s' '{encoded}' | base64 --decode > {target}"
              )
          commands.append(
              "API_IMAGE=" + os.environ["API_IMAGE"] +
              " bash /opt/voltrix/scripts/deploy.sh"
          )
          Path("ssm-parameters.json").write_text(
              json.dumps({
                  "commands": commands,
                  "executionTimeout": ["600"]
              })
          )
          PY

      - name: Ejecutar despliegue y verificar resultado
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "Comando SSM: $COMMAND_ID"

          for intento in $(seq 1 150); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Estado:Status,Salida:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          test "$STATUS" = "Success"
