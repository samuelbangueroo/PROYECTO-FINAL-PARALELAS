# =============================================================================
# Contrato OpenAPI v03 — Equipo 2: Telemetría de Plantas
# Borrador para coordinación: consulta con filtros y paginación.
# =============================================================================
openapi: 3.0.3
info:
  title: Voltrix Energy · Telemetría de Plantas         
  version: 1.2.0
  description: |
    Contrato HTTP del servicio **Telemetría de Plantas** (Equipo 2). Recibe y almacena
    lecturas de sensores simuladas y permite consultarlas por planta.

    **Dependencia: Inventario de Activos (Equipo 1)**

    - Validar lotes con `POST /activos/consulta`, en bloques de hasta 200 IDs únicos.
      Enviar `X-Equipo-Consumidor: equipo-2`. Los IDs desconocidos se reportan en
      `desconocidos`; no invalidan toda la consulta.
    - Descartar lecturas con activo desconocido o cuyo `plantaId` no coincida con el
      `plantaId` del activo encontrado. Se aceptan lecturas en cualquiera de los tres
      estados operativos del inventario.
    - Si una lectura incluye `estadoReportado`, reportar sus cambios con
      `POST /activos/actualizaciones-estado`, usando `fechaHora` como `actualizadoEn`.
      En cada racha de estados iguales se conserva el primer cambio y su fecha. Los
      cambios encadenados se envían en solicitudes sucesivas y en orden cronológico;
      se espera cada respuesta antes de continuar. Cada solicitud admite hasta 100
      cambios con IDs únicos. Los reintentos conservan las mismas marcas temporales.

    **Consumidores previstos**

    | Equipo | Servicio | Operación prevista |
    |---|---|---|
    | 3 | Alertas y Notificaciones | `GET /telemetria/{plantaId}` |
    | 4 | Reportes de Generación | `GET /telemetria/{plantaId}` |
    | 5 | Pronóstico de Generación | `GET /telemetria/{plantaId}` |

    Los consumidores deben enviar `X-Equipo-Consumidor: equipo-<N>`; el encabezado se
    documenta como opcional para permitir llamadas sin él, pero se recomienda siempre.
    Toda respuesta de negocio incluye `X-Request-Id`; registrarlo en los logs.
    Fechas RFC 3339 con zona horaria. Errores usan el esquema común `Error`.
    `429` incluye `Retry-After`; `503` indica indisponibilidad local y `502` una falla
    de Inventario. La consulta por planta admite filtros y devuelve una página por solicitud.
  contact:
    name: Equipo 2 · Telemetría de Plantas               
servers:                                                  # COMÚN
  - url: http://{host}:{puerto}
    description: Despliegue del Componente B (EC2) o entorno local. La dirección vigente está en la hoja Coordinacion_Voltrix.
    variables:
      host:
        default: localhost
        description: IP pública o DNS de la instancia EC2.
      puerto:
        default: "8080"
tags:
  - name: Telemetría
    description: Lecturas de sensores recibidas por planta y activo.
  - name: Procesamiento
    description: Operación intensiva con la técnica de paralelismo o concurrencia exigida al equipo.
  - name: Operación
    description: Salud del servicio y publicación del contrato.

paths:
  # ---------------------------------------------------------------------------
  # Endpoints mínimos del servicio Telemetría.
  # Consulta de lecturas por planta:
  # ---------------------------------------------------------------------------
  /telemetria/{plantaId}:
    get:
      tags: [Telemetría]
      operationId: consultarTelemetriaPorPlanta
      summary: Consultar lecturas de una planta
      description: |
        Devuelve una página de lecturas individuales de la planta indicada.
        Aplica en conjunto los filtros presentes antes de paginar. Cada límite de
        fecha es opcional: `desde <= fechaHora < hasta` cuando van ambos.
        Se comparan instantes con su zona horaria y, si se envían ambos límites,
        `desde` debe ser anterior a `hasta`.

        Ordena por `fechaHora` ascendente, con un identificador interno de la lectura
        como desempate. Usa `offset` y `limit` sobre los resultados ya filtrados.
        Si hay más resultados, devuelve `X-Next-Offset`. Para seguir, conserva
        planta, filtros y `limit`, y usa ese valor como `offset`.
        Cada solicitud consulta los datos disponibles en ese momento.
      parameters:
        - $ref: '#/components/parameters/PlantaId'
        - $ref: '#/components/parameters/EquipoConsumidor'
        - $ref: '#/components/parameters/Desde'
        - $ref: '#/components/parameters/Hasta'
        - $ref: '#/components/parameters/ActivoIdFiltro'
        - $ref: '#/components/parameters/TipoActivoFiltro'
        - $ref: '#/components/parameters/MetricaFiltro'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Una página de lecturas. Devuelve una lista vacía si no hay coincidencias o el offset ya alcanzó el final.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            X-Next-Offset:
              $ref: '#/components/headers/X-Next-Offset'
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  $ref: '#/components/schemas/LecturaTelemetria'
              examples:
                ejemplo:
                  $ref: '#/components/examples/LecturaTelemetriaEjemplo'
                potenciaTurbina:
                  summary: Una página de lecturas de potencia de turbina
                  value:
                    - plantaId: PL-041
                      activoId: PL-041-TB-03
                      fechaHora: '2026-11-24T05:10:00Z'
                      metrica: potencia
                      valor: 850
                      unidad: W
                sinCoincidencias:
                  summary: Ninguna lectura coincide con los filtros
                  value: []
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '503':
          $ref: '#/components/responses/NoDisponible'

  # Ingesta y procesamiento del lote de lecturas:
  /telemetria:
    post:
      tags: [Procesamiento]
      operationId: registrarTelemetria
      summary: Registrar un lote de lecturas
      description: |
        Recibe un lote de lecturas. Consulta Inventario en bloques de hasta 200 IDs únicos,
        descarta activos desconocidos y lecturas cuyo activo pertenezca a otra planta, y acepta
        los tres estados del inventario. Si se informa `estadoReportado`, compara con el estado vigente y detecta solo cambios:
        colapsa las lecturas consecutivas con el mismo estado y conserva la fecha de la primera
        lectura de cada racha. Envía cambios a `POST /activos/actualizaciones-estado` en orden
        cronológico, en solicitudes sucesivas y esperando cada respuesta. Cada solicitud contiene
        hasta 100 cambios con IDs no repetidos; los cambios posteriores del mismo activo van en
        solicitudes siguientes. Ante un reintento se conservan las marcas `actualizadoEn`.
        Con `modo=secuencial` procesa lecturas una por una; con `modo=paralelo`, divide las
        lecturas válidas en bloques equilibrados entre workers.
      parameters:
        - $ref: '#/components/parameters/EquipoConsumidor'
        - $ref: '#/components/parameters/Modo'
        - $ref: '#/components/parameters/Workers'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoteTelemetria'
            example:
              lecturas:
                - plantaId: PL-001
                  activoId: PL-001-PS-07
                  fechaHora: '2026-11-18T15:30:00Z'
                  metrica: potencia
                  valor: 0
                  unidad: W
                  estadoReportado: fuera_de_servicio
      responses:
        '200':
          description: Procesamiento completado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoLote'
              example:
                recibidas: 1000
                procesadas: 800
                descartadas: 200
                activosInvalidos: [PL-001-PS-99]
                metricas:
                  modo: paralelo
                  workers: 4
                  elementos: 800
                  duracionMs: 180
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '429':
          $ref: '#/components/responses/Sobrecarga'
        '502':
          $ref: '#/components/responses/DependenciaFallida'
        '503':
          $ref: '#/components/responses/NoDisponible'

  # --------------------------- COMÚN: no modificar ---------------------------
  /health:
    get:
      tags: [Operación]
      operationId: consultarSalud
      summary: Comprobar la disponibilidad del servicio y de su base de datos
      description: No exige `X-Equipo-Consumidor`. Debe responder rápido y sin llamar a otros equipos de forma bloqueante.
      responses:
        '200':
          description: Servicio disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: disponible
                baseDatos: ok
                version: 1.0.0
                tiempoActivoSeg: 3600
        '503':
          description: El servicio no puede acceder a su base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
              example:
                estado: no_disponible
                baseDatos: error
                version: 1.0.0
                tiempoActivoSeg: 3600

  /openapi.yaml:
    get:
      tags: [Operación]
      operationId: obtenerContrato
      summary: Descargar este contrato
      description: URL que se registra en la columna "URL del contrato OpenAPI" de la hoja Coordinacion_Voltrix.
      responses:
        '200':
          description: Contrato en formato YAML.
          content:
            application/yaml:
              schema:
                type: string

components:
  parameters:
    # COMÚN
    EquipoConsumidor:
      name: X-Equipo-Consumidor
      in: header
      required: false
      description: Equipo que hace la llamada. Se registra en los logs como evidencia de consumo entre células.
      schema:
        type: string
        pattern: '^equipo-[1-7]$'
        example: equipo-2
    Desde:
      name: desde
      in: query
      required: false
      description: Instante inicial incluido. Fecha y hora RFC 3339 con zona horaria.
      schema:
        type: string
        format: date-time
      example: '2026-11-24T05:00:00Z'
    Hasta:
      name: hasta
      in: query
      required: false
      description: Instante final excluido. Fecha y hora RFC 3339 con zona horaria.
      schema:
        type: string
        format: date-time
      example: '2026-11-25T05:00:00Z'
    ActivoIdFiltro:
      name: activoId
      in: query
      required: false
      description: Devuelve lecturas de este activo dentro de la planta consultada.
      schema:
        $ref: '#/components/schemas/Identificador'
      example: PL-041-TB-03
    TipoActivoFiltro:
      name: tipoActivo
      in: query
      required: false
      description: |
        Filtra por el tipo del activo informado por Inventario. Por ejemplo,
        `turbina` selecciona las lecturas de las turbinas de la planta.
      schema:
        type: string
        enum: [panel_solar, turbina, banco_baterias]
      example: turbina
    MetricaFiltro:
      name: metrica
      in: query
      required: false
      description: |
        Coincidencia exacta con el nombre de la métrica almacenada.
        Por ejemplo, `potencia` o `velocidad_viento` si se registró con ese nombre.
      schema:
        type: string
        minLength: 1
      example: potencia
    Limit:
      name: limit
      in: query
      required: false
      description: Número máximo de lecturas que devuelve la página.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      required: false
      description: Número de coincidencias ordenadas que se omiten antes de formar la página.
      schema:
        type: integer
        minimum: 0
        default: 0
    Modo:
      name: modo
      in: query
      required: false
      description: Versión del procesamiento a ejecutar (línea base o técnica paralela/concurrente).
      schema:
        type: string
        enum: [secuencial, paralelo]
        default: paralelo
    Workers:
      name: workers
      in: query
      required: false
      description: Número de hilos, goroutines, procesos o workers a usar en modo paralelo. Por defecto lo decide el servicio.
      schema:
        type: integer
        minimum: 1
        maximum: 64
    # Parámetro de la ruta de consulta.
    PlantaId:
      name: plantaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identificador'
      example: PL-001

  headers:
    # COMÚN
    X-Request-Id:
      description: Identificador de la petición, presente también en los logs del servicio.
      schema:
        type: string
        format: uuid
    X-Next-Offset:
      description: |
        Offset para la siguiente página, igual al offset actual más las lecturas devueltas.
        Solo se incluye si quedan más coincidencias.
      schema:
        type: integer
        minimum: 1
    Retry-After:
      description: Segundos que el consumidor debe esperar antes de reintentar.
      schema:
        type: integer
        minimum: 1
        example: 1

  responses:
    # COMÚN
    SolicitudInvalida:
      description: La solicitud no cumple el contrato.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOLICITUD_INVALIDA
            mensaje: La solicitud no cumple el contrato.
            requestId: 0a4e9c1d-3f2b-4e8a-b7c6-5d1e2f3a4b5c
            detalles:
              - campo: desde
                problema: debe ser una fecha RFC 3339 con zona horaria
    NoEncontrado:
      description: El recurso no existe.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El recurso REC-999 no existe.
            requestId: 9c2f7e4a-1d3b-4a6c-8e5f-0b7d9a1c3e2f
    Conflicto:
      description: Ya existe un recurso con ese identificador o el estado actual impide la operación.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DUPLICADO
            mensaje: Ya existe un recurso con el identificador REC-001.
            requestId: 4d8b2a6e-7c1f-4e3a-9b5d-2f6a8c0e1b4d
    Sobrecarga:
      description: Capacidad de admisión agotada. Reintentar después de `Retry-After` segundos.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: SOBRECARGA
            mensaje: El servicio está atendiendo el máximo de peticiones simultáneas.
            requestId: 2e7a4c9b-6d1f-4b8e-a3c5-7f0d2b9e4a1c
    NoDisponible:
      description: Base de datos o servicio no disponible.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: NO_DISPONIBLE
            mensaje: No hay conexión con la base de datos.
            requestId: 8f1b3d5a-2c7e-4f9a-b6d0-1e4c7a9b2d5f
    DependenciaFallida:
      description: Un servicio de otro equipo del que se depende no respondió o respondió con error.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            codigo: DEPENDENCIA_FALLIDA
            mensaje: Inventario de Activos respondió 503.
            requestId: 3c6e9f2a-8b1d-4e7c-a5f0-6d2b9e1c4a7f
            detalles:
              - campo: equipo-1
                problema: POST /activos/consulta respondió 503

  examples:
    # Ejemplo del servicio Telemetría.
    LecturaTelemetriaEjemplo:
      summary: Lectura de telemetría de ejemplo
      value:
        - plantaId: PL-001
          activoId: PL-001-PS-07
          fechaHora: '2026-11-18T15:30:00Z'
          metrica: potencia
          valor: 0
          unidad: W
          estadoReportado: fuera_de_servicio

  schemas:
    # ------------------------------- COMÚN -------------------------------
    Identificador:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
      example: PL-001-PS-07
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, requestId]
      properties:
        codigo:
          type: string
          pattern: '^[A-Z_]+$'
          description: |
            Código estable en MAYÚSCULAS. Comunes: SOLICITUD_INVALIDA, NO_ENCONTRADO, DUPLICADO,
            SOBRECARGA, NO_DISPONIBLE, DEPENDENCIA_FALLIDA, ERROR_INTERNO. Cada equipo puede
            agregar los suyos y documentarlos aquí.
          example: NO_ENCONTRADO
        mensaje:
          type: string
        requestId:
          type: string
        detalles:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [campo, problema]
            properties:
              campo:
                type: string
              problema:
                type: string
    Salud:
      type: object
      additionalProperties: false
      required: [estado, baseDatos]
      properties:
        estado:
          type: string
          enum: [disponible, no_disponible]
        baseDatos:
          type: string
          enum: [ok, error]
        version:
          type: string
        tiempoActivoSeg:
          type: integer
          minimum: 0
    MetricasProcesamiento:
      type: object
      additionalProperties: false
      required: [modo, workers, elementos, duracionMs]
      description: Evidencia de cada ejecución intensiva, útil para el benchmark secuencial contra paralelo.
      properties:
        modo:
          type: string
          enum: [secuencial, paralelo]
        workers:
          type: integer
          minimum: 1
        elementos:
          type: integer
          minimum: 0
          description: Cantidad de elementos procesados (lecturas, activos, plantas, liquidaciones...).
        duracionMs:
          type: integer
          minimum: 0

    # ------------------------- Esquemas del servicio -------------------------
    LecturaTelemetria:
      type: object
      additionalProperties: false
      required: [plantaId, activoId, fechaHora, metrica, valor, unidad]
      description: estadoReportado es opcional y se incluye cuando el sensor informa un estado operativo.
      properties:
        plantaId:
          $ref: '#/components/schemas/Identificador'
        activoId:
          $ref: '#/components/schemas/Identificador'
        fechaHora:
          type: string
          format: date-time
        metrica:
          type: string
        valor:
          type: number
          format: double
        unidad:
          type: string
        estadoReportado:
          $ref: '#/components/schemas/EstadoReportado'
    EstadoReportado:
      type: string
      description: Estado comunicado por el sensor; usa los mismos valores que Inventario de Activos.
      enum: [operativo, en_mantenimiento, fuera_de_servicio]
    LoteTelemetria:
      type: object
      additionalProperties: false
      required: [lecturas]
      properties:
        lecturas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LecturaTelemetria'
    ResultadoLote:
      type: object
      additionalProperties: false
      required: [recibidas, procesadas, descartadas, metricas]
      properties:
        recibidas:
          type: integer
          minimum: 0
        procesadas:
          type: integer
          minimum: 0
        descartadas:
          type: integer
          minimum: 0
        activosInvalidos:
          type: array
          items:
            $ref: '#/components/schemas/Identificador'
        metricas:
          $ref: '#/components/schemas/MetricasProcesamiento'
