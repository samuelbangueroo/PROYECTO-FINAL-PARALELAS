x-db-url: &db-url
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5433/${POSTGRES_DB}

services:
  # El nombre del servicio (db) es el host que usa la API; container_name no cambia eso.
  db:
    image: postgres:16-alpine
    container_name: app_db
    # Valores iniciales para poca memoria (t2.micro de 1 GiB).
    command: ["postgres", "-c", "port=5433", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: "5433"   # puerto del DAS; lo usan pg_isready y psql dentro del contenedor
    # Sin "ports": PostgreSQL solo es alcanzable dentro de la red de Compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: aplica las migraciones y termina.
  migrate:
    build: .
    image: telemetria-api
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *db-url
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  api:
    build: .
    image: telemetria-api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    restart: unless-stopped
    mem_limit: 256m
    environment:
      <<: *db-url
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
